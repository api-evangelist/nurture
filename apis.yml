name: Nurture
description: >-
  Nurture is an EdTech company that turns children's screen time into
  skill-building experiences through an interactive storytelling app for kids
  aged 5-7. Built on the thesis that AI is mastering information while human
  skills — critical thinking, curiosity, empathy, creativity, and resilience —
  still need to be nurtured, the app delivers character-driven story adventures
  with practice-based learning, no in-app purchases, no ads, and no endless
  autoplay. It is COPPA-compliant and features licensed brands such as Care
  Bears, Crayola, and Pocoyo. Nurture is a consumer mobile product distributed
  on the iOS App Store, Google Play, and Amazon Appstore, sold as a $36/year
  subscription with a 7-day free trial. It is a Seedcamp portfolio company. As a
  consumer application, Nurture publishes no public developer API, SDK, or
  integration surface; api.nurture.is serves only an internal app backend.
